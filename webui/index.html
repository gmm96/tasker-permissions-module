<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fix=cover">
    <title>Tasker Permissions</title>
    <link rel="stylesheet" href="css/style.css">
    <!--
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    -->
</head>
<body>

    <div id="mainView" class="view-screen active">
        <div class="container">
            <header>
                <nav class="tabs-container">
                    <button type="button" class="tab-btn active" data-filter="all-apps">All apps <span class="tab-count" id="count-all-apps">0</span></button>
                    <button type="button" class="tab-btn" data-filter="none-granted">None granted <span class="tab-count" id="count-none-granted">0</span></button>
                    <button type="button" class="tab-btn" data-filter="partial">Partial <span class="tab-count" id="count-partial">0</span></button>
                    <button type="button" class="tab-btn" data-filter="all-granted">All granted <span class="tab-count" id="count-all-granted">0</span></button>
                    <button type="button" class="tab-btn" data-filter="not-installed">Not installed <span class="tab-count" id="count-not-installed">0</span></button>
                </nav>

                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by app name or package...">
                    <button type="button" id="clearSearchBtn" class="clear-search-btn" aria-label="Clear search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="empty-message bridge-debug" id="bridgeDebug"></div>

                <div class="bulk-btn-container">
                    <button type="button" class="btn-confirm btn-danger" id="revokeAllBtn">Revoke all</button>
                    <button type="button" class="btn-confirm" id="grantAllBtn">Grant all</button>
                </div>
            </header>

            <main class="list-container" id="appsList">
                <div class="empty-message">Loading apps...</div>
            </main>

            <div class="footer">
                <a href="https://github.com/gmm96" target="_blank" class="footer-link">
                    <img class="footer-logo" src="assets/github.png" alt="GitHub logo">
                    <p class="footer-text">Tasker Hidden Permissions v1.0</p>
                    <p class="footer-text">by gmm96</p>
                </a>
            </div>
        </div>
    </div>

    <div id="detailView" class="view-screen">
        <div class="container">
            <div class="detail-sticky-top">
                <div class="detail-header-card">
                    <div class="detail-top-nav">
                        <button type="button" class="btn-back" id="backBtn" aria-label="Back">
                            <svg width="24" height="24" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="detail-app-meta">
                        <img id="detailIcon" class="detail-icon" src="assets/android.png" alt="App icon">
                        <div class="detail-app-info">
                            <h2 class="detail-title" id="detailTitle">App name</h2>
                            <p class="detail-package" id="detailPackage">Package name</p>
                            <span class="status-badge" id="detailBadge">Status</span>
                        </div>
                    </div>
                </div>

                <div class="section-bar">
                    <p class="section-title">Permissions</p>
                    <div class="perm-select-actions">
                        <button type="button" class="btn-text-action btn-danger" id="deselectAllBtn">Clear all</button>
                        <button type="button" class="btn-text-action" id="selectAllBtn">Select all</button>
                    </div>
                </div>

                <div class="search-container detail-search-container">
                    <input type="text" id="detailSearchInput" class="search-input" placeholder="Search permission...">
                    <button type="button" id="clearDetailSearchBtn" class="clear-search-btn" aria-label="Clear search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="perms-list" id="detailPermsList"></div>

            <div class="detail-actions">
                <button type="button" class="btn-confirm btn-danger" id="revokeSelectedBtn">Revoke selected</button>
                <button type="button" class="btn-confirm" id="grantSelectedBtn">Grant selected</button>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Processing...</div>
    </div>

    <script src="js/loader.js"></script>
</body>
</html>
